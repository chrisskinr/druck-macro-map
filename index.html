<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ground:#edf1ef; --surface:#ffffff; --surface-2:#f5f8f6; --ink:#13201b; --ink-2:#4b5b55; --ink-3:#77867f;
  --rule:#d2dbd7; --rule-2:#e3e9e6; --accent:#1d5fa8; --accent-weak:rgba(29,95,168,.13);
  --bull:#0ca30c; --bear:#d03b3b; --flat:#c9950f; --bull-bg:rgba(12,163,12,.11); --bear-bg:rgba(208,59,59,.11); --flat-bg:rgba(201,149,15,.14);
  --shadow:0 1px 2px rgba(19,32,27,.06),0 8px 24px rgba(19,32,27,.08);
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --ground:#0c1311; --surface:#131c19; --surface-2:#18231f; --ink:#e5ede9; --ink-2:#a2b1ab; --ink-3:#74847e;
    --rule:#26332f; --rule-2:#1f2a26; --accent:#6aa5ee; --accent-weak:rgba(106,165,238,.16);
    --bull-bg:rgba(12,163,12,.18); --bear-bg:rgba(208,59,59,.2); --flat-bg:rgba(250,178,25,.16); --flat:#fab219;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#0c1311; --surface:#131c19; --surface-2:#18231f; --ink:#e5ede9; --ink-2:#a2b1ab; --ink-3:#74847e;
  --rule:#26332f; --rule-2:#1f2a26; --accent:#6aa5ee; --accent-weak:rgba(106,165,238,.16);
  --bull-bg:rgba(12,163,12,.18); --bear-bg:rgba(208,59,59,.2); --flat-bg:rgba(250,178,25,.16); --flat:#fab219;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);margin:0}
.wrap{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:28px 64px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header / regime ---------- */
.top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.title h1{font:800 clamp(40px,6vw,76px)/.88 var(--display);letter-spacing:.005em;text-transform:uppercase;margin-top:10px}
.title .asof{margin-top:12px;color:var(--ink-2);font-size:13px}
.regime{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
.regime-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.regime-label{font:800 34px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.regime-score{font:500 22px/1 var(--mono)}
.regime-sub{color:var(--ink-2);margin-top:6px;font-size:13px}
.gauge{position:relative;height:30px;margin-top:14px}
.gauge .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bear-bg),var(--surface-2) 50%,var(--bull-bg));border:1px solid var(--rule)}
.gauge .mid{position:absolute;left:50%;top:6px;width:1px;height:18px;background:var(--ink-3)}
.gauge .mark{position:absolute;top:5px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.gauge .ghost{position:absolute;top:8px;width:10px;height:14px;border-radius:2px;border:1.5px dashed var(--ink-3);transform:translateX(-5px)}
.gauge-ticks{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink-3)}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px 14px;margin-top:16px}
.lay{display:flex;flex-direction:column;gap:4px}
.lay .n{font-size:11px;color:var(--ink-2);display:flex;justify-content:space-between;gap:4px}
.lay .bar{position:relative;height:8px;background:var(--surface-2);border:1px solid var(--rule-2);border-radius:4px;overflow:hidden}
.lay .fill{position:absolute;top:0;bottom:0}
.lay .zero{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink-3)}

/* ---------- checks & commentary ---------- */
section{margin-top:30px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);font-size:12.5px}
.chk .ic{font:600 12px var(--mono);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none}
.chk.on .ic{background:var(--bear-bg);color:var(--bear)}
.chk.off .ic{background:var(--bull-bg);color:var(--bull)}
.chk .d{color:var(--ink-3);font-family:var(--mono);font-size:11.5px}
.chk.on{border-color:color-mix(in srgb,var(--bear) 35%,var(--rule))}
.comm{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:28px}
.comm .headline{font:600 20px/1.35 var(--sans);max-width:60ch;text-wrap:balance}
.comm .paras{columns:2 340px;column-gap:28px;margin-top:14px;color:var(--ink-2)}
.comm .paras p{margin:0 0 12px;break-inside:avoid}
.watch{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
.watch h3{font:800 17px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px}
.watch ul{margin:0;padding-left:18px;display:grid;gap:7px;color:var(--ink-2)}
.byline{margin-top:10px;font-size:12px;color:var(--ink-3)}

/* ---------- map ---------- */
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;gap:5px;align-items:center}
.search{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;width:170px;color:var(--ink)}
.mapbox{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:
  linear-gradient(var(--surface-2),var(--surface-2)) padding-box;}
.map{position:relative;display:grid;grid-template-columns:repeat(7,minmax(172px,1fr));gap:34px;padding:18px 22px 26px;min-width:1340px}
.map svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.col-h{padding:2px 2px 8px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.col-h .t{font:800 17px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.col-h .b{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.35;min-height:30px}
.col-h .s{font:500 11px var(--mono);margin-top:4px}
.tile{position:relative;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:9px 10px 8px;cursor:pointer;display:grid;gap:3px;transition:opacity .15s,border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile .nm{font-size:11.5px;line-height:1.25;color:var(--ink-2);padding-right:22px;min-height:29px}
.tile .v{font:500 16px/1.1 var(--mono)}
.tile .c{font:11px var(--mono);color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.tile svg{display:block;width:100%;height:26px}
.tile .sig{position:absolute;top:8px;right:8px}
.tile.w3::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--ink)}
.tile.stale .c .dt{color:var(--flat)}
.map.focus .tile{opacity:.28}
.map.focus .tile.hl,.map.focus .tile.sel{opacity:1}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.pill{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:600 10px var(--mono)}
.pill.b{background:var(--bull-bg);color:var(--bull)}
.pill.r{background:var(--bear-bg);color:var(--bear)}
.pill.n{background:var(--flat-bg);color:var(--flat)}
.pill.x{background:var(--surface-2);color:var(--ink-3)}
.edge{fill:none;stroke:var(--ink-3);stroke-opacity:.22;stroke-width:1.2}
.edge.hl{stroke:var(--accent);stroke-opacity:.95;stroke-width:2}
.map.focus .edge:not(.hl){stroke-opacity:.05}

.also{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.also-h{font:800 17px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.foot{margin-top:36px;color:var(--ink-3);font-size:12px;border-top:1px solid var(--rule);padding-top:14px;display:grid;gap:4px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--rule);z-index:50;
  overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);box-shadow:-20px 0 40px rgba(0,0,0,.12)}
.drawer .x{position:sticky;top:0;float:right;border:1px solid var(--rule);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
.drawer h3{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:8px 44px 0 0}
.dv{display:flex;align-items:baseline;gap:12px;margin-top:12px;flex-wrap:wrap}
.dv .big{font:500 30px/1 var(--mono)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
.tag.b{background:var(--bull-bg);color:var(--bull)} .tag.r{background:var(--bear-bg);color:var(--bear)} .tag.n{background:var(--flat-bg);color:var(--flat)} .tag.x{background:var(--surface-2);color:var(--ink-3)}
.why{font:12px var(--mono);color:var(--ink-3);margin-top:6px}
.dcomm{margin-top:14px;font-size:14.5px;line-height:1.55}
.chartbox{margin-top:16px;border:1px solid var(--rule);border-radius:10px;padding:10px 10px 4px;background:var(--surface-2)}
.chartbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.chartbar .seg button{padding:3px 9px;font-size:11.5px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:210px}
.chart .axis{font:10.5px var(--mono);fill:var(--ink-3)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
.chart .area{fill:var(--accent-weak)}
.chart .thr{stroke:var(--ink-3);stroke-dasharray:4 4;stroke-width:1}
.chart .cross{stroke:var(--ink-2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font:11.5px var(--mono);padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:14px}
.mgrid div{background:var(--surface);padding:9px 10px}
.mgrid .k{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.mgrid .val{font:500 14px var(--mono);margin-top:2px}
.rule-box{margin-top:16px;border-left:3px solid var(--ink);padding:2px 0 2px 14px}
.rule-box .k{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.rule-box p{margin:4px 0 0}
.quote{margin-top:10px;font-style:italic;color:var(--ink-2)}
.links{margin-top:18px;display:grid;gap:10px}
.links .k{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 5px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.src{margin-top:18px;font-size:12px;color:var(--ink-3)}

@media (max-width:980px){
  .top{grid-template-columns:1fr}
  .comm{grid-template-columns:1fr}
}
@media (max-width:760px){
  .mapbox{border:0;background:none;overflow:visible}
  .map{grid-template-columns:1fr;min-width:0;padding:0;gap:22px}
  .map svg.edges{display:none}
  .col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .col-h{grid-column:1/-1}
  .col-h .b{min-height:0}
  .search{width:100%}
  .drawer{top:auto;height:88vh;width:100%;border-left:0;border-top:1px solid var(--rule);border-radius:16px 16px 0 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

"2025-08-04",7.178],["2025-08-11",7.1884],["2025-08-18",7.1847],["2025-08-25",7.151],["2025-09-02",7.139],["2025-09-09",7.1209],["2025-09-16",7.1142],["2025-09-23",7.1116],["2025-09-30",7.119],["2025-10-07",7.12],["2025-10-15",7.1262],["2025-10-22",7.1257],["2025-10-29",7.098],["2025-11-05",7.126],["2025-11-13",7.095],["2025-11-20",7.1098],["2025-11-28",7.0751],["2025-12-05",7.0696],["2025-12-12",7.0548],["2025-12-19",7.0409],["2025-12-29",7.0056],["2026-01-06",6.9834],["2026-01-13",6.9775],["2026-01-21",6.9637],["2026-01-28",6.9462],["2026-02-04",6.9415],["2026-02-11",6.9125],["2026-02-19",6.9031],["2026-02-26",6.8409],["2026-03-05",6.8912],["2026-03-12",6.8689],["2026-03-19",6.8998],["2026-03-26",6.9107],["2026-04-02",6.8856],["2026-04-09",6.8314],["2026-04-16",6.8208],["2026-04-23",6.826],["2026-04-30",6.8273],["2026-05-07",6.8014],["2026-05-14",6.7851],["2026-05-21",6.8025],["2026-05-29",6.7662],["2026-06-05",6.7655],["2026-06-12",6.7626],["2026-06-22",6.7745],["2026-06-29",6.7936],["2026-07-07",6.7934],["2026-07-14",6.77],["2026-07-21",6.7656],["2026-07-28",6.771],["2026-08-04",6.7532],["2026-08-11",6.745],["2026-08-18",6.743],["2026-08-25",6.7203],["2026-09-01",6.7202],["2026-09-09",6.7059],["2026-09-16",6.706]]}},"commentary":{"asof":"2026-09-23","author":"Claude (Mercutio), applying DRUCKENMILLER.md to the data below. Commentary is interpretation, not Druck's words; only text in quotation marks with a citation is his.","headline":"The economy is running hot and the Fed has started raising rates again. Money is still plentiful for now, but it's no longer growing, and most stocks have already started falling even though the S&P 500 is near its high.","narrative":["Why the market hasn't cracked yet: interest rates are still low compared with how fast the economy is growing. Nominal growth is running about 6.6% a year against a 3.9% Fed rate, and the money supply is still expanding (+5.7% a year). Cheap, plentiful money keeps asset prices up.","What's changed: Druckenmiller cares less about how much money there is than about which way it's heading, and it has turned. The cash available to markets has shrunk slightly over the past three months. Central banks in Europe and Japan are pulling money out of their systems, and the Fed just raised rates on September 16 with at least one more hike penciled in.","Three things that squeeze company profits are all rising at once: the dollar (+4% over the year), oil (+53%) and long-term interest rates (+0.8 percentage points). Druck calls that combination the \"three death knells\" for markets. Inflation is also stuck around 3.3%, well above the Fed's 2% target. The Fed can't cut rates to rescue stocks, and bonds won't cushion a stock sell-off the way they usually do.","The S&P 500 sits only 1.2% below its record, but that's almost entirely a handful of AI chip stocks. The average stock is lagging, and the groups that usually turn first before a downturn are already falling: homebuilders, retailers, trucking companies, small companies and regional banks. A year ago about 90% of industry groups were in uptrends; today it's about half. Druck says every major bear market has started with this kind of narrowing.","The last domino is the corporate bond market, where stress usually shows up before a recession. It hasn't fallen yet: borrowing costs for most junk-rated companies are still near their lows. The very weakest borrowers are starting to struggle, though. Their borrowing costs are up about 1.2 percentage points in three months.","How Druck would play it: take risk down, hold cash in T-bills, and avoid long-term bonds and broad stock-index exposure. Wait for the big opportunity, which comes when the Fed signals it's done raising rates. At that point short-term Treasuries should rally hard."],"watch":["Junk-bond spreads above 3 percentage points: credit stress confirms the downturn","Money available to markets falling more than 2% in 3 months: the squeeze is speeding up","The S&P 500 breaking below its 50-day average while fewer than 45% of industry groups are in uptrends: the index follows the average stock down","The Fed signals it's done raising rates and oil drops below $85: the signal to buy short-term Treasuries","The opposite, an all-clear: most industry groups (75%+) back in uptrends and the average stock outperforming the big names again"],"nodes":{"fed_funds":"Hiked 25bp on 9/16 to 3.75\u20134.00%, the first hike since 2023, and the dots show one more. Direction matters more than level: a tightening Fed into narrowing leadership is his classic setup.","martian_gap":"+2.9pp: policy is still well below where nominal growth says it should be. That's why liquidity hasn't dried up. It's also why the Fed is behind and will keep hiking. (NGDP data is Q2; stale ~6 months.)","real_ff":"Barely positive at +0.3pp. That isn't restrictive enough to break inflation, but the direction is up.","taylor_gap":"The funds rate sits ~2.4pp below a simple Taylor rule. It's a sanity check only, but it agrees with the Martian gap: the Fed has room and reason to keep going.","fed_bs":"Flat to slightly up over 3 months. QT isn't the story this cycle; the rate hikes are.","tga":"Roughly flat over 3 months after rebuilding by $205bn over the year. It's not adding liquidity anymore.","rrp":"Effectively zero. The reverse-repo buffer that offset QT in 2023\u201324 is gone, so any new drain hits reserves directly.","net_liq":"$5.86T, down $33bn in 13 weeks and $52bn over a year. The level is fine; the direction isn't.","net_liq_roc":"\u22120.55% over 13 weeks. It's marginal, but on the wrong side of zero, and his highest-value signal is the turn from injection to withdrawal.","m2":"+5.7% y/y: money is still growing. This is the main reason the index is holding up.","real_m2":"+2.3pp: his 1988 gauge is still positive. It argues against an imminent liquidity crunch; the problem is price-of-money and leadership, not quantity.","m2_minus_ip":"+4.3pp excess liquidity (M2 well ahead of industrial production). That money has gone into financial assets, which is part of why the cap-weight index sits near highs.","global_cb":"G3 balance sheets \u22124.2% y/y. The BoJ (\u221211%) and ECB (\u22123%) are draining, and the BoJ is also hiking. Global liquidity is contracting even as US M2 grows.","ecb_bs":"\u22123% y/y and still shrinking.","boj_bs":"\u221211% y/y, with the BoJ hiking to 1.25% on 9/18. The yen carry and JGB defense that used to export liquidity are unwinding.","em_fx":"EM currencies are still above their 200-day (+1.6%). His canary hasn't died yet, so no EM-led crack so far.","us2y":"4.71% on FRED (4.89% intraday 9/23), +55bp in 3 months and at its highest since mid-2024. The front end is pricing more hikes. His rule is to own it after the last hike, not the first.","us10y":"~5% and at a 19-year high, +46bp in 3 months. Rising on good growth news with oil up: bonds are not hedging stocks in this regime.","real10y":"2.63% and rising, the steepest hurdle for long-duration assets since 2007. It's a headwind for gold, long-duration tech and bitcoin.","ten_vs_ngdp":"\u22122.2pp. The 10y trades well below nominal GDP, and Treasury buybacks are defending that. By his golden rule the long end is a short.","curve_2s10s":"+26bp and flattening slightly as the front end reprices hikes.","mortgage30":"6.95%, +48bp in 3 months. It's hitting the leading industry (housing) directly.","core_pce":"3.34%: the binding constraint. With inflation this sticky the Fed can't pivot to rescue risk assets.","cpi":"3.35% y/y. Headline and core are stuck well above target.","breakeven5y5y":"2.36%: long-run expectations are anchored. The bond market isn't pricing a regime break, only a sticky cycle.","ngdp":"+6.6% nominal growth (Q2), a hot economy in nominal terms. That's the Martian numerator.","wti":"+53% y/y on Hormuz/Iran supply shocks. It's the loudest triad leg and it feeds straight into headline inflation.","dxy_yoy":"+3.9% y/y. The weakest triad leg, but still a headwind for S&P earnings and EM.","usd_broad":"The broad trade-weighted dollar is flat y/y. The DXY strength is mostly vs EUR/JPY, not EM.","rates_chg_1y":"+81bp y/y on the 10y. That's the rates leg of the triad.","triad":"All three legs are up, and the regression composite is \u22120.45\u03c3, a headwind for forward earnings. \"Three death knells\" in his words.","corp_profits":"+28% y/y through Q2, so profits haven't peaked. His rule: no recession before profits peak. The earnings bubble risk he flagged on 9/10 is about AI suppliers' margins rolling over from here.","hy_oas":"268bp, near its tights and flat over 3 months. The index hasn't confirmed stress yet. It's the key tell to watch.","ccc_oas":"+119bp in 3 months to 10.75%. The weakest borrowers are cracking first, the classic early crack under the surface of credit.","ig_oas":"77bp, very tight. Investment grade is untouched.","nfci":"Financial conditions are still loose (\u22120.56) and little changed.","sloos":"Banks aren't tightening C&I standards (net 0%). Credit supply isn't the problem yet.","rsp_spy":"Equal-weight is \u22123.5% vs its 200-day relative line and \u22127.5% off its 1y relative high. That's textbook narrowing.","breadth200":"52% of 40 industry groups are above their 200-day, down from ~90% a year ago and 77% three months ago. The index is at highs and breadth is collapsing.","iwm_spy":"Small caps are \u22124.3% vs their 200-day relative line and \u22129% in 3 months: rate-sensitive, levered and first to feel hikes.","xhb_spy":"Homebuilders are \u221215% vs their 200-day relative line and \u221229% off their high. The classic leading industry is breaking.","iyt_spy":"Transports are \u22128% vs their 200-day relative line. Trucking is his 6\u20138-month recession lead.","xrt_spy":"Retail is \u221211% vs its 200-day relative line. Retail leads slightly.","kre_spy":"Regional banks are \u22126%, reflecting credit and rate stress on the lenders.","smh_spy":"Semis are +15% vs their 200-day relative line but \u22127% in 3 months. The one group holding the index up is losing momentum. \"A top is when the rate of change of its going up changes\" [2024-11-06 NBIM].","defensives_spy":"Defensives are lagging (\u22129%), so this isn't a classic risk-off rotation yet. Money is concentrating in AI, not hiding.","copper_gold":"Copper/gold is +17% vs its 200-day. The real economy (and the AI power build-out) is outrunning 'monetary radicalism'. It's consistent with nominal growth staying hot, which is exactly why the Fed keeps hiking.","spx":"7,706, 1.2% off its high and +7% vs its 200-day. The cap-weight index is the side that gives, per the internals.","ndx":"Riding semis/AI. That's the concentration risk.","vix":"15: calm. Complacency near highs with breadth collapsing is how tops look.","tlt":"\u22124.5% vs its 200-day. The long bond is in a downtrend while the Fed hikes and inflation binds.","hyg":"Flat at its 200-day. It hasn't broken; a break below ~77 confirms the credit leg.","dxy":"101, +1.9% vs its 200-day.","gold":"\u22125% vs its 200-day and \u221219% off its high as real yields climb and the Hormuz premium fades.","btc":"+19% vs its 200-day on a 3-month rally, but \u221232% off its high into a hiking Fed. A bear-market rally until liquidity turns.","ewy":"Korea is +21% vs its 200-day but \u221215% off its high. Druck is scouting there (Samsung/Hynix/Doosan), but the tape is extended and fading.","ewj":"Japan is near highs even as the BoJ hikes: his favorite breadth market in 2023.","fxi":"China is below its 200-day. He won't invest there under the current leader.","eem":"EM is +9% vs its 200-day, so EM equities aren't signalling stress yet."}}}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const N = D.nodes, C = D.commentary || {nodes:{}}, R = D.regime;
const MAP_LAYERS = ['policy','liquidity','rates','inflation','earnings','internals','assets'];
const layerMeta = Object.fromEntries(D.layers.map(l=>[l.id,l]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const visible = n => !(n.tags||[]).includes('helper');

// upstream index
const UP = {}; Object.values(N).forEach(n => (n.feeds||[]).forEach(t => (UP[t] = UP[t]||[]).push(n.id)));

const sigCls = s => s>0?'b':s<0?'r':'n';
const sigTxt = s => s>0?'Supportive':s<0?'Hostile':'Neutral';
const sigIc  = s => s>0?'▲':s<0?'▼':'●';
const hasSig = n => n.signal_why != null;
function pill(n){ return hasSig(n) ? `<span class="pill ${sigCls(n.signal)}" aria-label="${sigTxt(n.signal)}">${sigIc(n.signal)}</span>` : `<span class="pill x" aria-label="No signal">·</span>`; }

function chgKind(u){ if(u==='%') return 'bp'; if(u==='z') return 'z'; if(u && (u==='pp' || u.startsWith('%'))) return 'pp'; if(u==='index' && false) return 'abs'; return 'pct'; }
function fmtChg(n, per){
  const m = n.metrics, k = chgKind(n.units);
  if(k==='pct'){ const v = m['pct_'+per]; return v==null?'–':(v>=0?'+':'')+v.toFixed(1)+'%'; }
  const v = m['chg_'+per]; if(v==null) return '–';
  if(k==='bp') return (v>=0?'+':'')+Math.round(v*100)+'bp';
  if(k==='z') return (v>=0?'+':'')+v.toFixed(2)+'σ';
  return (v>=0?'+':'')+v.toFixed(2)+'pp';
}
function fmtVal(v,u){
  if(v==null||isNaN(v)) return '–';
  if(u==='$mn') return '$'+(v/1e6).toFixed(2)+'T';
  if(u==='$bn') return '$'+(Math.abs(v)>=10?Math.round(v).toLocaleString():v.toFixed(2))+'bn';
  if(u==='pp') return (v>=0?'+':'')+v.toFixed(2)+'pp';
  if(u && u.startsWith('%')) return v.toFixed(2)+'%';
  if(u==='z') return (v>=0?'+':'')+v.toFixed(2)+'σ';
  if(u==='ratio') return v.toFixed(4);
  return Math.abs(v)>=1000? Math.round(v).toLocaleString() : v.toFixed(2);
}
function stale(n){ const d=n.metrics.stale_days; return d>45; }
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}); }

function spark(pts){
  if(!pts || pts.length<2) return '<svg viewBox="0 0 100 26"></svg>';
  const ys=pts.map(p=>p[1]), mn=Math.min(...ys), mx=Math.max(...ys), r=(mx-mn)||1;
  const X=i=>1+i/(pts.length-1)*96, Y=v=>23-(v-mn)/r*20;
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const lx=X(pts.length-1), ly=Y(ys[ys.length-1]);
  return `<svg viewBox="0 0 100 26" preserveAspectRatio="none"><path d="${d} L${lx.toFixed(1)} 25 L1 25Z" fill="var(--accent-weak)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.3" vector-effect="non-scaling-stroke"/><circle cx="${lx}" cy="${ly}" r="1.8" fill="var(--ink)"/></svg>`;
}

function tile(n){
  const st = stale(n);
  return `<button class="tile ${n.weight>=3&&n.tags.includes('druck')?'w3':''} ${st?'stale':''}" data-id="${n.id}" aria-label="${esc(n.name)}: ${esc(n.value_fmt)}, ${hasSig(n)?sigTxt(n.signal):'no signal'}">
    <span class="sig">${pill(n)}</span>
    <span class="nm">${esc(n.name)}</span>
    <span class="v">${esc(n.value_fmt)}</span>
    ${spark(n.spark)}
    <span class="c"><span>3m ${fmtChg(n,'3m')}</span><span class="dt">${st?fmtDate(n.metrics.date):'1y '+fmtChg(n,'1y')}</span></span>
  </button>`;
}

// ---------- header
$('#asof').innerHTML = `Data as of <span class="num">${esc(D.generated)}</span> · ${Object.values(N).filter(visible).length} indicators · FRED + Yahoo · commentary ${esc(C.asof||'')}`;
const pos = v => (50 + Math.max(-1,Math.min(1,v))*50) + '%';
const LW = R.layer_weights;
const layerName = {liquidity:'Liquidity',policy:'Policy',rates:'Price of money',inflation:'Inflation',earnings:'Earnings & credit',internals:'Internals'};
$('#regime').innerHTML = `
  <div class="regime-head"><div><div class="eyebrow">Druck regime read</div><div class="regime-label" style="margin-top:6px">${esc(R.label)}</div></div>
  <div class="regime-score num">${R.score>=0?'+':''}${R.score.toFixed(2)}</div></div>
  <div class="regime-sub">Liquidity <b>${esc(R.liquidity.direction)}</b>, ${esc(R.liquidity.turning)} · 13 weeks ago the read was <span class="num">${R.score_13w>=0?'+':''}${R.score_13w.toFixed(2)}</span></div>
  <div class="gauge" role="img" aria-label="Regime score ${R.score.toFixed(2)} on a scale from -1 hostile to +1 supportive; 13 weeks ago ${R.score_13w.toFixed(2)}">
    <div class="track"></div><div class="mid"></div>
    <div class="ghost" style="left:${pos(R.score_13w)}" title="13 weeks ago"></div>
    <div class="mark" style="left:${pos(R.score)}"></div>
  </div>
  <div class="gauge-ticks"><span>−1 hostile</span><span>0</span><span>+1 supportive</span></div>
  <div class="layers">${Object.keys(LW).map(L=>{const v=R.layers[L], p=R.layers_13w[L];
    const w=Math.abs(v)*50, left=v>=0?50:50-w;
    return `<div class="lay" title="${layerName[L]}: ${v.toFixed(2)} now, ${p.toFixed(2)} 13w ago, weight ${Math.round(LW[L]*100)}%">
      <div class="n"><span>${layerName[L]}</span><span class="num">${v>=0?'+':''}${v.toFixed(2)}</span></div>
      <div class="bar"><div class="fill" style="left:${left}%;width:${w}%;background:${v>=0?'var(--bull)':'var(--bear)'};opacity:.75"></div><div class="zero"></div></div>
      <div class="n"><span class="num" style="color:var(--ink-3)">wt ${Math.round(LW[L]*100)}%</span><span class="num" style="color:var(--ink-3)">13w ${p>=0?'+':''}${p.toFixed(2)}</span></div></div>`}).join('')}</div>`;

$('#checks').innerHTML = R.checks.map(c=>`<span class="chk ${c.flag?'on':'off'}"><span class="ic">${c.flag?'!':'✓'}</span><span>${esc(c.check)}</span><span class="d">${esc(c.detail)}</span></span>`).join('');

$('#comm').innerHTML = `<div><div class="eyebrow">The read</div><div class="headline" style="margin-top:8px">${esc(C.headline||R.headline)}</div>
  <div class="paras">${(C.narrative||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>
  <div class="byline">${esc(C.author||'')}</div></div>
  <div class="watch"><h3>What would change the read</h3><ul>${(C.watch||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`;

// ---------- map
const map = $('#map');
MAP_LAYERS.forEach(L=>{
  const nodes = Object.values(N).filter(n=>n.layer===L && visible(n));
  nodes.sort((a,b)=>(b.weight||0)-(a.weight||0));
  const sc = R.layers[L];
  const col = document.createElement('div'); col.className='col';
  col.innerHTML = `<div class="col-h"><div class="t">${esc(layerMeta[L].title)}</div><div class="b">${esc(layerMeta[L].blurb)}</div>
    ${sc!=null?`<div class="s" style="color:${sc>0.2?'var(--bull)':sc<-0.2?'var(--bear)':'var(--ink-3)'}">composite ${sc>=0?'+':''}${sc.toFixed(2)}</div>`:'<div class="s" style="color:var(--ink-3)">prices</div>'}</div>` + nodes.map(tile).join('');
  map.appendChild(col);
});
['fiscal','context'].forEach(L=>{ $('#'+L).innerHTML = Object.values(N).filter(n=>n.layer===L).map(tile).join(''); });

const svg = $('#edges');
function drawEdges(){
  if(getComputedStyle(svg).display==='none') return;
  const box = map.getBoundingClientRect();
  svg.setAttribute('width', map.scrollWidth); svg.setAttribute('height', map.scrollHeight);
  const rect = id => { const el = map.querySelector(`.tile[data-id="${id}"]`); if(!el) return null; const r=el.getBoundingClientRect(); return {l:r.left-box.left,r:r.right-box.left,t:r.top-box.top,b:r.bottom-box.top,m:(r.top+r.bottom)/2-box.top,col:MAP_LAYERS.indexOf(N[id].layer)}; };
  let out='';
  Object.values(N).forEach(n=>(n.feeds||[]).forEach(t=>{
    const a=rect(n.id), b=rect(t); if(!a||!b) return;
    let d;
    if(b.col>a.col){ const dx=Math.max(30,(b.l-a.r)/2); d=`M${a.r} ${a.m} C${a.r+dx} ${a.m} ${b.l-dx} ${b.m} ${b.l} ${b.m}`; }
    else if(b.col<a.col){ const lift=Math.min(a.t,b.t)-14; d=`M${a.l+20} ${a.t} C${a.l+20} ${lift} ${b.r-20} ${lift} ${b.r-20} ${b.t}`; }
    else { const x=a.r+14; d=`M${a.r} ${a.m} C${x+14} ${a.m} ${x+14} ${b.m} ${b.r} ${b.m}`; }
    out+=`<path class="edge" data-a="${n.id}" data-b="${t}" d="${d}"/>`;
  }));
  svg.innerHTML = out;
  applyFocus();
}
let focusId=null, selId=null;
function neighbors(id){ return new Set([id,...(N[id].feeds||[]),...(UP[id]||[])]); }
function applyFocus(){
  const id = focusId || selId;
  map.classList.toggle('focus', !!id);
  const nb = id? neighbors(id): new Set();
  map.querySelectorAll('.tile').forEach(t=>{ t.classList.toggle('hl', nb.has(t.dataset.id)); t.classList.toggle('sel', t.dataset.id===selId); });
  svg.querySelectorAll('.edge').forEach(e=>e.classList.toggle('hl', !!id && (e.dataset.a===id || e.dataset.b===id)));
}
map.addEventListener('mouseover', e=>{ const t=e.target.closest('.tile'); if(t){ focusId=t.dataset.id; applyFocus(); }});
map.addEventListener('mouseleave', ()=>{ focusId=null; applyFocus(); });
document.addEventListener('click', e=>{ const t=e.target.closest('.tile,.chip'); if(t) openNode(t.dataset.id); });
window.addEventListener('resize', ()=>requestAnimationFrame(drawEdges));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawEdges);
drawEdges();

$('#q').addEventListener('input', e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.tile').forEach(t=>{ const n=N[t.dataset.id]; t.style.opacity = !q || (n.name+' '+n.id+' '+(n.series||'')).toLowerCase().includes(q) ? '' : '.18'; });
});

// ---------- drawer
const drawer=$('#drawer'), scrim=$('#scrim');
let range='2Y';
function closeDrawer(){ drawer.hidden=true; scrim.hidden=true; selId=null; applyFocus(); }
scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !drawer.hidden) closeDrawer(); });

function srcLink(n){
  if(n.source==='fred') return `FRED <a href="https://fred.stlouisfed.org/series/${esc(n.series)}" target="_blank" rel="noopener">${esc(n.series)}</a>`;
  if(n.source==='yf') return `Yahoo <a href="https://finance.yahoo.com/quote/${encodeURIComponent(n.series)}" target="_blank" rel="noopener">${esc(n.series)}</a>`;
  if(n.source==='yf_ratio') return `Yahoo ratio <span class="num">${esc(n.series)}</span>`;
  if(n.source==='breadth') return `Breadth across ${n.series.length} ETFs`;
  return `Derived: <span class="num">${esc(n.expr)}</span>`;
}
function chip(id){ const n=N[id]; if(!n||!visible(n)) return ''; return `<button class="chip" data-id="${id}">${pill(n)}${esc(n.name)}</button>`; }

function openNode(id){
  const n=N[id]; if(!n) return;
  selId=id; applyFocus();
  const m=n.metrics, isRatio=['yf','yf_ratio'].includes(n.source) || n.id==='defensives_spy';
  const cells=[['1 month',fmtChg(n,'1m')],['3 months',fmtChg(n,'3m')],['1 year',fmtChg(n,'1y')],
    isRatio?['vs 200-day',m.vs_ma200==null?'–':(m.vs_ma200>=0?'+':'')+m.vs_ma200.toFixed(1)+'%']:['5y z-score',m.z5y==null?'–':(m.z5y>=0?'+':'')+m.z5y.toFixed(2)],
    isRatio?['off 1y high',m.off_high_1y==null?'–':m.off_high_1y.toFixed(1)+'%']:['6 months',fmtChg(n,'6m')],
    ['last obs', fmtDate(m.date)+(m.stale_days>45?` · ${m.stale_days}d old`:'')]];
  const comm = C.nodes[id] || (n.signal_why? `${sigTxt(n.signal)}: ${n.signal_why}.` : 'Tracked for context; no signal assigned.');
  drawer.innerHTML = `<button class="x" id="dx" aria-label="Close">✕</button>
    <div class="eyebrow">${esc(layerMeta[n.layer]?.title||n.layer)}${n.tags.includes('druck')?' · Druck input · weight '+n.weight:''}</div>
    <h3>${esc(n.name)}</h3>
    <div class="dv"><span class="big">${esc(n.value_fmt)}</span>${hasSig(n)?`<span class="tag ${sigCls(n.signal)}">${sigIc(n.signal)} ${sigTxt(n.signal)}</span>`:'<span class="tag x">No signal</span>'}
      ${hasSig(n)?`<span class="tag x" title="Signal 13 weeks ago">13w ago: ${sigTxt(n.signal_13w)}</span>`:''}</div>
    ${n.signal_why?`<div class="why">${esc(n.signal_why)}</div>`:''}
    <div class="dcomm">${esc(comm)}</div>
    <div class="chartbox"><div class="chartbar"><span class="eyebrow">${esc(n.display==='yoy'?'Year-over-year %':n.units||'')}</span>
      <div class="seg" id="rng">${['1Y','2Y','5Y','10Y'].map(r=>`<button aria-pressed="${r===range}" data-r="${r}">${r}</button>`).join('')}</div></div>
      <div class="chart" id="chart"></div></div>
    <div class="mgrid">${cells.map(c=>`<div><div class="k">${c[0]}</div><div class="val">${esc(c[1])}</div></div>`).join('')}</div>
    ${(n.rule||n.quote)?`<div class="rule-box"><div class="k">Druck rule</div>${n.rule?`<p>${esc(n.rule)}</p>`:''}${n.quote?`<p class="quote">${esc(n.quote)}</p>`:''}</div>`:''}
    <div class="links">
      ${(UP[id]||[]).length?`<div><div class="k">Driven by</div><div class="chips">${UP[id].map(chip).join('')}</div></div>`:''}
      ${(n.feeds||[]).length?`<div><div class="k">Feeds into</div><div class="chips">${n.feeds.map(chip).join('')}</div></div>`:''}
    </div>
    <div class="src">${srcLink(n)} · units ${esc(n.units||'')}</div>`;
  drawer.hidden=false; scrim.hidden=false; drawer.scrollTop=0;
  $('#dx').onclick=closeDrawer; $('#dx').focus({preventScroll:true});
  $('#rng').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; range=b.dataset.r; $('#rng').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.r===range)); chart(n); };
  chart(n);
}

function niceTicks(mn,mx,count){
  const span=mx-mn||1, step0=span/count, mag=Math.pow(10,Math.floor(Math.log10(step0))), f=step0/mag;
  const step=(f<1.5?1:f<3?2:f<7?5:10)*mag; const out=[]; for(let v=Math.ceil(mn/step)*step; v<=mx+1e-9; v+=step) out.push(+v.toFixed(10)); return out;
}
function chart(n){
  const el=$('#chart'); const days={'1Y':365,'2Y':730,'5Y':1826,'10Y':3653}[range];
  const cut=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  let pts=(n.hist||[]).filter(p=>p[0]>=cut); if(range!=='10Y'){ const sp=(n.spark||[]).filter(p=>p[0]>=cut); if(range!=='5Y' && sp.length>pts.length) pts=sp; }
  if(pts.length<2){ el.innerHTML='<div style="padding:40px;text-align:center;color:var(--ink-3)">Not enough history in this range.</div>'; return; }
  const W=440,H=210,pl=46,pr=10,pt=10,pb=24;
  const ys=pts.map(p=>p[1]); const sig=n.signal||{};
  let mn=Math.min(...ys), mx=Math.max(...ys);
  const thr = (N[n.id] && n.signal_why && /level/.test(n.signal_why)) ? parseFloat((n.signal_why.match(/if [<>] (-?[\d.]+)/)||[])[1]) : NaN;
  if(!isNaN(thr)){ mn=Math.min(mn,thr); mx=Math.max(mx,thr); }
  const pad=(mx-mn)*0.08||1; mn-=pad; mx+=pad;
  const t0=new Date(pts[0][0]).getTime(), t1=new Date(pts[pts.length-1][0]).getTime();
  const X=d=>pl+(new Date(d).getTime()-t0)/((t1-t0)||1)*(W-pl-pr), Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const yt=niceTicks(mn,mx,4);
  const line=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const yrs=[]; const y0=new Date(t0).getFullYear(), y1=new Date(t1).getFullYear();
  const stepY = (y1-y0)>6?2:1;
  for(let y=y0+1;y<=y1;y+=stepY) yrs.push(y);
  const xt = yrs.length>=2 ? yrs.map(y=>[`${y}-01-01`, String(y)]) : [0,0.5,1].map(f=>{const d=new Date(t0+(t1-t0)*f).toISOString().slice(0,10); return [d, fmtDate(d)];});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(n.name)} history">
    ${yt.map(v=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${pl-6}" y="${Y(v)+3.5}" text-anchor="end">${fmtVal(v,n.units)}</text>`).join('')}
    ${xt.map(([d,l])=>`<text class="axis" x="${X(d)}" y="${H-6}" text-anchor="middle">${l}</text>`).join('')}
    ${!isNaN(thr)?`<line class="thr" x1="${pl}" x2="${W-pr}" y1="${Y(thr)}" y2="${Y(thr)}"/><text class="axis" x="${W-pr}" y="${Y(thr)-4}" text-anchor="end">signal line</text>`:''}
    <path class="area" d="${line} L${X(pts[pts.length-1][0])} ${H-pb} L${X(pts[0][0])} ${H-pb}Z"/>
    <path class="line" d="${line}" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(pts[pts.length-1][0])}" cy="${Y(ys[ys.length-1])}" r="3.5" fill="var(--ink)" stroke="var(--surface-2)" stroke-width="2"/>
    <line class="cross" id="cx" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/>
    <circle id="cd" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip" hidden></div>`;
  const svgEl=el.querySelector('svg'), tip=el.querySelector('#tip'), cx=el.querySelector('#cx'), cd=el.querySelector('#cd');
  const move=ev=>{
    const r=svgEl.getBoundingClientRect(); const sx=(ev.clientX-r.left)/r.width*W;
    let best=0,bd=1e9; pts.forEach((p,i)=>{const dd=Math.abs(X(p[0])-sx); if(dd<bd){bd=dd;best=i;}});
    const p=pts[best], px=X(p[0]), py=Y(p[1]);
    cx.setAttribute('x1',px); cx.setAttribute('x2',px); cx.setAttribute('visibility','visible');
    cd.setAttribute('cx',px); cd.setAttribute('cy',py); cd.setAttribute('visibility','visible');
    tip.hidden=false; tip.style.left=(px/W*r.width)+'px'; tip.style.top=(py/H*r.height)+'px';
    tip.textContent=`${fmtDate(p[0])} · ${fmtVal(p[1],n.units)}`;
  };
  const hit=el.querySelector('#hit');
  hit.addEventListener('pointermove',move); hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{tip.hidden=true;cx.setAttribute('visibility','hidden');cd.setAttribute('visibility','hidden');});
}

$('#foot').innerHTML = `<div>Built from <span class="num">research/macro/registry.yaml</span> → <span class="num">macro.db</span> → <span class="num">latest.json</span>. Signals: +1 supportive for risk assets / liquidity, −1 hostile. The regime score weights the layer composites: ${Object.entries(LW).map(([k,v])=>layerName[k]+' '+Math.round(v*100)+'%').join(', ')}.</div>
  <div>Druck quotes are verbatim from the Druckenmiller corpus with citations. Commentary is Claude's interpretation, not investment advice. Some series lag (GDP, profits, PCE); their dates show in amber on the tiles.</div>`;

if(location.hash && N[location.hash.slice(1)]) openNode(location.hash.slice(1));
})();
</script>

</body></html>
